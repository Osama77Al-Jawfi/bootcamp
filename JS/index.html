
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM XSS Security Tool</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .description {
            text-align: center;
            color: #666;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            margin-top: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: monospace;
            resize: vertical;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
            color: white;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        .unsafe-btn {
            background-color: #d9534f;
        }

        .safe-btn {
            background-color: #198754;
        }

        .clear-btn {
            background-color: #555;
        }

        .output {
            padding: 15px;
            margin-top: 10px;
            min-height: 70px;
            border: 1px solid #ccc;
            border-radius: 5px;
            overflow-wrap: anywhere;
            background-color: #fafafa;
        }

        .unsafe-section {
            margin-top: 25px;
            color: #b02a37;
        }

        .safe-section {
            margin-top: 25px;
            color: #198754;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            background-color: #eee;
            border-radius: 5px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DOM XSS Security Tool</h1>

        <p class="description">
            Compare unsafe and safe ways of displaying user input.
        </p>

        <label for="userInput">
            Enter your HTML or JavaScript payload:
        </label>

        <textarea
            id="userInput"
            placeholder="Enter your input here..."
        ></textarea>

        <div>
            <button id="unsafeBtn" class="unsafe-btn">
                Unsafe Display
            </button>

            <button id="safeBtn" class="safe-btn">
                Safe Display
            </button>

            <button id="clearBtn" class="clear-btn">
                Clear Outputs
            </button>
        </div>

        <div class="unsafe-section">
            <h2>Unsafe Output (innerHTML)</h2>
            <div id="unsafeOutput" class="output"></div>
        </div>

        <div class="safe-section">
            <h2>Safe Output (textContent)</h2>
            <div id="safeOutput" class="output"></div>
        </div>

        <div class="status">
            <strong>Status:</strong>
            <span id="statusMessage">Ready to test.</span>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
